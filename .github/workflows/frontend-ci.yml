name: Angular Build
on:
  push:
    paths:
      - geeksclub-angular/**
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./geeksclub-angular
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: './geeksclub-angular/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present