name: Build

on:
  push:
    branches:
      - 'main'
      - 'feature/*'
      - 'fix/*'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Build with Maven
        run: ./mvnw -ntp verify
